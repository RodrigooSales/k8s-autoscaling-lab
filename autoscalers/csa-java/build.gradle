plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation 'com.google.code.gson:gson:2.13.2'
    implementation('io.kubernetes:client-java:26.0.0') {
        exclude group: 'com.google.auth'
        exclude group: 'com.google.protobuf'
        exclude group: 'io.kubernetes', module: 'client-java-proto'
        exclude group: 'io.prometheus'
        exclude group: 'org.bouncycastle'
        exclude group: 'software.amazon.awssdk'
    }
    implementation 'org.yaml:snakeyaml:2.6'
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.17'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'org.csajava.App'
}
