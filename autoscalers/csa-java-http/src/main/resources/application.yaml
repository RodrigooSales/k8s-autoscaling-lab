spring:
  application:
    name: csa-java-http

csa:
  namespace: default
  deployment-name: kube-znn
  metric-name: znn_latency_ms_p95
  metric-selector: ""
  target-value: "1000"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
