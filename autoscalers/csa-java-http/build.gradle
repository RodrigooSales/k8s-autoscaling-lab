plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

apply plugin: 'io.spring.dependency-management'

group = 'org.csajavahttp'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation('io.kubernetes:client-java:26.0.0') {
        exclude group: 'com.google.auth'
        exclude group: 'com.google.protobuf'
        exclude group: 'io.kubernetes', module: 'client-java-proto'
        exclude group: 'io.prometheus'
        exclude group: 'org.bouncycastle'
        exclude group: 'software.amazon.awssdk'
    }

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
